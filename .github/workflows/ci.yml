name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-e-testes:
    name: lint-e-testes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: poupa_ci
          POSTGRES_PASSWORD: ci-only-disposable
          POSTGRES_DB: poupa_grana_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U poupa_ci -d poupa_grana_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      TEST_DATABASE_URL: postgresql://poupa_ci:ci-only-disposable@127.0.0.1:5432/poupa_grana_ci
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            requirements-production.txt
      - name: Install pinned dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Lint
        run: python -m ruff check .
      - name: Django checks and migrations
        run: |
          python manage.py check
          python manage.py migrate --noinput
          python manage.py makemigrations --check --dry-run
      - name: Tests with disposable PostgreSQL
        run: python -m pytest
      - name: Build production image without runtime secrets
        run: docker build -t poupa-grana:ci .
      - name: Verify non-root runtime and static collection
        run: |
          test "$(docker run --rm poupa-grana:ci id -u)" = "10001"
          docker run --rm \
            -e DJANGO_SETTINGS_MODULE=config.settings.railway \
            -e RAILWAY_PROJECT_ID=ci-context-only \
            -e SECRET_KEY=ci-only-build-validation-secret-key-with-no-real-data-1234567890 \
            -e 'DATABASE_URL=postgresql://ci:fictitious@unused.invalid/unused?sslmode=require' \
            -e ALLOWED_HOSTS=finance.example.invalid \
            poupa-grana:ci python manage.py collectstatic --noinput
